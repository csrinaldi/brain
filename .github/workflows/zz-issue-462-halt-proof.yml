# TEMPORARY — proof harness for #462. Removed before this PR is reviewed; the
# permanent evidence is the run URL recorded on the PR and on #462.
#
# It does NOT copy the halt path. It EXTRACTS the real `window` step's `run:`
# block out of .github/workflows/governance-postmerge.yml (the same text-parse
# seam brain/scripts/vcs/release-postmerge-workflows.test.mjs uses) and executes
# it verbatim, twice:
#
#   job `without-issues-write` — permissions exactly as they were BEFORE this PR.
#     Expected: the alarm cannot be filed. Reproduces the #462 outage.
#   job `with-issues-write`    — permissions exactly as they are AFTER this PR.
#     Expected: the alarm IS filed, and its URL is printed.
#
# The cursor ref really is absent on origin, so this exercises the genuine
# ABSENT halt — no simulation, no stubbed gh.

name: zz-issue-462-halt-proof

on:
  push:
    branches: [fix/issue-462-postmerge-alarm-issues-write]

concurrency: { group: zz-issue-462-halt-proof, cancel-in-progress: false }

jobs:
  without-issues-write:
    name: halt path WITHOUT issues write (reproduces the #462 outage)
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write } # the pre-PR block, verbatim
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract the real window step and execute it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node .github/zz-issue-462-extract.mjs || { echo "extraction failed"; exit 1; }
          echo "───── sha256 of the extracted (real) halt script ─────"
          sha256sum "$RUNNER_TEMP/window-step.sh"
          echo "───── executing the real halt path ─────"
          bash "$RUNNER_TEMP/window-step.sh"
          echo "WINDOW_STEP_EXIT=$?  (2 = the by-design fail-closed halt)"
          exit 0
      - name: Did an alarm issue appear?
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh issue list --label governance:cursor-missing --state open --json number,title,url
          echo "issue-list exit: $?"

  with-issues-write:
    name: halt path WITH issues write (this PR)
    needs: without-issues-write
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, issues: write } # the post-PR block, verbatim
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract the real window step and execute it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node .github/zz-issue-462-extract.mjs || { echo "extraction failed"; exit 1; }
          echo "───── sha256 of the extracted (real) halt script ─────"
          sha256sum "$RUNNER_TEMP/window-step.sh"
          echo "───── executing the real halt path ─────"
          bash "$RUNNER_TEMP/window-step.sh"
          echo "WINDOW_STEP_EXIT=$?  (2 = the by-design fail-closed halt)"
          exit 0
      - name: The alarm that was filed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "── open governance:cursor-missing issues ──"
          gh issue list --label governance:cursor-missing --state open --json number,title,url,createdAt
          echo "issue-list exit: $?"
