# upgrade-smoke.yml — informational upgrade-safety smoke (issue #1277).
#
# Runs `npm run test:upgrade`: installs @logikas/brain@<second-latest tag> in a
# clean container, customises the consumer, upgrades to the latest tag and
# asserts the managed core moved while consumer-owned files survived.
#
# INFORMATIONAL. Not a required status context and not in GOVERNANCE_JOBS (same
# stance as m4-danger-paths.yml): a red run does not block a merge, it tells a
# maintainer the upgrade path regressed. Its own workflow, not a governance.yml
# job, because governance.yml is a ratified, vendored contract (ADR-0015).

name: upgrade-smoke
on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Globs, not file names: engine-blind-gates.test.mjs reads a literal
      # brain/scripts/<file> in a workflow as an INVOCATION and demands it be
      # in VERIFICATION_SURFACE. Covers brain-upgrade.mjs and lib/installer.mjs.
      - 'brain/scripts/**'
      - 'brain/core/config-migrations.mjs'
      - 'test/upgrade/**'
      - '.github/workflows/upgrade-smoke.yml'

permissions:
  contents: read

jobs:
  upgrade-smoke:
    name: upgrade-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Tags select FROM/TO; run.sh reads them from the checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Same `.brain-source` gate as m4-danger-paths: never build from a non-brain tree.
      - name: upgrade smoke (registry install · customise · upgrade · assert)
        if: ${{ hashFiles('.brain-source') != '' }}
        env:
          VCS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:upgrade
