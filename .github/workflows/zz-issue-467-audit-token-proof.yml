# TEMPORARY — proof harness for #467. Removed before this PR is reviewed; the
# permanent evidence is the run URL recorded on the PR and on #467.
#
# It does NOT copy the audit path. It EXTRACTS the real `audit` step — BOTH its
# `run: |` body AND its `env:` map — out of governance-postmerge.yml and
# executes it verbatim, twice, over the SAME real window (653e34e..c724942, the
# window the cursor is currently frozen on):
#
#   job `pre-fix`  — extracts from governance-postmerge.yml AS IT WAS at c724942
#                    (`git show c724942:…`), i.e. with no `env:` on the audit
#                    step. Expected: [FAIL] issueLink on c724942, code 1.
#                    Reproduces run 31094912872 on demand.
#   job `post-fix` — extracts from the working-tree file, i.e. WITH the env:
#                    block this PR adds. Expected: [PASS], code 0.
#
# The two jobs run the same extractor over two versions of the same file. The
# ONLY difference between them is the four lines of `env:` — the extracted run:
# bodies are byte-identical, and their sha256 is printed by both jobs to prove
# it. The runner carries no ambient GH_TOKEN/GITHUB_TOKEN: the token reaches
# `gh` only if the shipped step declares it.

name: zz-issue-467-audit-token-proof

on:
  push:
    branches: [fix/issue-467-postmerge-audit-step-gh-token]

# Verbatim the real job's block, so the proof runs at the real scopes.
permissions: { contents: write, pull-requests: write, issues: write }

concurrency: { group: zz-issue-467-audit-token-proof, cancel-in-progress: false }

env:
  # The ONLY token in the runner's environment, under a name neither `gh` nor
  # brain-audit reads. It becomes GH_TOKEN only via the extracted env: block.
  HARNESS_GITHUB_TOKEN: ${{ github.token }}
  AUDIT_RANGE: 653e34e..c724942

jobs:
  pre-fix:
    name: audit step as shipped at c724942 (no env:) — reproduces the #467 defect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract the c724942 audit step and execute it
        run: |
          set +e
          git show c724942:.github/workflows/governance-postmerge.yml > "$RUNNER_TEMP/pre.yml" || exit 1
          node .github/zz-issue-467-extract.mjs --yaml "$RUNNER_TEMP/pre.yml" --step audit \
            --emit run --out "$RUNNER_TEMP/audit-step.sh" --range "$AUDIT_RANGE" || exit 1
          node .github/zz-issue-467-extract.mjs --yaml "$RUNNER_TEMP/pre.yml" --step audit \
            --emit env --out "$RUNNER_TEMP/audit-env.sh" || exit 1
          echo "───── sha256 of the extracted (real) audit run: block ─────"
          sha256sum "$RUNNER_TEMP/audit-step.sh"
          echo "───── the step's own env: bindings ─────"
          sed -e 's/\${HARNESS_GITHUB_TOKEN}/<token>/' "$RUNNER_TEMP/audit-env.sh"
          echo "───── gh sees a token? ─────"
          ( . "$RUNNER_TEMP/audit-env.sh"; [ -n "${GH_TOKEN:-}" ] && echo "GH_TOKEN: set" || echo "GH_TOKEN: UNSET" )
          echo "───── executing the real audit path over $AUDIT_RANGE ─────"
          ( . "$RUNNER_TEMP/audit-env.sh"; bash "$RUNNER_TEMP/audit-step.sh" )
          echo "AUDIT_STEP_EXIT=$?"
          echo "───── the code the step reported to the workflow ─────"
          grep '^code=' "$GITHUB_OUTPUT" || echo "(no code= written)"
          exit 0

  post-fix:
    name: audit step with this PR's env: GH_TOKEN — the fix
    needs: pre-fix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract the working-tree audit step and execute it
        run: |
          set +e
          node .github/zz-issue-467-extract.mjs --yaml .github/workflows/governance-postmerge.yml --step audit \
            --emit run --out "$RUNNER_TEMP/audit-step.sh" --range "$AUDIT_RANGE" || exit 1
          node .github/zz-issue-467-extract.mjs --yaml .github/workflows/governance-postmerge.yml --step audit \
            --emit env --out "$RUNNER_TEMP/audit-env.sh" || exit 1
          echo "───── sha256 of the extracted (real) audit run: block ─────"
          sha256sum "$RUNNER_TEMP/audit-step.sh"
          echo "───── the step's own env: bindings ─────"
          sed -e 's/\${HARNESS_GITHUB_TOKEN}/<token>/' "$RUNNER_TEMP/audit-env.sh"
          echo "───── gh sees a token? ─────"
          ( . "$RUNNER_TEMP/audit-env.sh"; [ -n "${GH_TOKEN:-}" ] && echo "GH_TOKEN: set" || echo "GH_TOKEN: UNSET" )
          echo "───── executing the real audit path over $AUDIT_RANGE ─────"
          ( . "$RUNNER_TEMP/audit-env.sh"; bash "$RUNNER_TEMP/audit-step.sh" )
          echo "AUDIT_STEP_EXIT=$?"
          echo "───── the code the step reported to the workflow ─────"
          grep '^code=' "$GITHUB_OUTPUT" || echo "(no code= written)"
          exit 0
