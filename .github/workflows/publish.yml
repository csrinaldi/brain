# publish.yml — publishes @logikas/brain to the npm registry (ADR-0030, #655).
#
# MANUAL ONLY, and that is the decision. Publishing is irreversible in a way
# tagging is not: an over-broad or wrong tarball cannot be cleanly unpublished
# (ADR-0030, Consequences). So there is no push or tag trigger — a human types
# the version.
#
# NOT MERGED INTO release.yml. That workflow is the rung-2 release GATE: it runs
# brain-audit and blocks. This one performs an irreversible outward-facing act.
# One refuses, the other publishes; giving them the same trigger would mean the
# audit's schedule decides when bytes reach strangers.
#
# TWO REHEARSALS, BECAUSE THEY ANSWER DIFFERENT QUESTIONS (#727).
#
#   `npm publish --dry-run`  →  "what would this tarball contain?"
#   `npm whoami`             →  "does this credential authenticate at all?"
#
# The dry-run PACKS. It prints the file list, the sizes and the integrity hash,
# and it never contacts the registry for auth. This comment used to say a
# rehearsal turns a token problem "into a red step before anything is uploaded".
# Run 32138680828 measured that false: the rehearsal stepped GREEN and the real
# publish returned E403 immediately after. The step every reader took for the
# credential gate was a packaging preview, so the first thing ever to exercise
# NPM_BRAIN_TOKEN was the irreversible act itself — the exact ordering every
# other step here exists to avoid.
#
# WHAT `npm whoami` DOES NOT PROVE, stated because an unstated limit is how the
# previous claim came to be read as coverage:
#   · it succeeds with a READ-ONLY token, so it does not prove publish rights;
#   · it does not prove the token bypasses 2FA — the E403 above was a 2FA
#     refusal, and this probe would have passed straight through it;
#   · it does not prove the token covers the `@logikas` scope.
# It catches an absent, malformed, expired or wrong-registry credential, and it
# stops there. That is a smaller claim than the one it replaces, and it is the
# whole of it.
#
# The scope rule is unchanged and still correct: the token must be scoped to
# `@logikas/*`, not to a package. `@logikas/brain` did not exist until the first
# publish, so a granular token limited to selected packages had nothing to
# select. No probe here can verify that — it is a property of the token as
# configured on the registry, and only the publish itself reports on it.
#
# `--access public` appears here AND in package.json's publishConfig. A scoped
# package publishes `restricted` by default: npm SUCCEEDS, the version is burned,
# and nobody can install it. Belt and braces, because the flag alone does not
# cover a manual `npm publish` from a laptop (ADR-0030 Amendment 2, #653).
#
# This workflow is deliberately NOT in package.json's `files`: a consumer needs
# the governance workflows, not brain's release machinery (#607).

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being published (must match package.json, e.g. 1.1.0)'
        required: true
        type: string

# The minimum: read the tree, publish from it. No writes to the repository.
permissions: { contents: read }

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The declared version and the manifest must agree. Typing the wrong one
      # here would publish a version nobody reviewed, under a number nobody
      # expects — and it cannot be taken back.
      - name: The input matches package.json
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::package.json says $declared, the run was dispatched for ${{ inputs.version }}"
            exit 1
          fi
          echo "publishing $declared"

      # A version number that already names a DIFFERENT tree is the one mistake
      # here that cannot be taken back. `v1.0.0` was cut against the git-tag
      # mechanism and hundreds of commits ago; publishing `1.0.0` from today's
      # tree would put those bytes behind a number that already means something
      # else, and npm versions are immutable.
      #
      # So: if a tag for this version exists and is not this commit, refuse.
      # No tag at all is fine — that is a normal pre-tag publish.
      - name: This version does not already name a different tree
        run: |
          v="${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            tagged="$(git rev-parse "refs/tags/v$v^{commit}")"
            head="$(git rev-parse HEAD)"
            if [ "$tagged" != "$head" ]; then
              echo "::error::tag v$v points at $tagged but HEAD is $head — publishing $v from here would put different bytes behind a version that already exists. Bump the version."
              exit 1
            fi
          fi

      # `npm install`, NOT `npm ci`. `npm ci` refuses without a lockfile, and this
      # repository gitignores `package-lock.json` on purpose (.gitignore — zero
      # dependencies, so the lockfile pins nothing). The first dispatch this
      # workflow ever had died here with EUSAGE, three steps before the upload,
      # and every check above it had passed (#725).
      #
      # At zero dependencies this is a no-op that succeeds. It stays correct the
      # day a dependency lands, which deleting the step outright would not —
      # `npm test` would then run against absent node_modules, silently.
      - run: npm install --no-audit --no-fund

      # The tarball's contents are decided by test/publish-allowlist.e2e.test.mjs,
      # which packs for real and walks what comes out. Running the suite before an
      # irreversible act is cheap; discovering it afterwards is not possible.
      - run: npm test

      # Rehearses the TARBALL. Local only — it never asks the registry anything,
      # so a credential fault cannot surface here. See the header.
      - name: Rehearse the tarball
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BRAIN_TOKEN }}

      # Rehearses the CREDENTIAL. The one step in this workflow before the
      # publish that actually round-trips NPM_BRAIN_TOKEN to the registry.
      #
      # Deliberately narrow: it catches an absent, malformed, expired or
      # wrong-registry token and nothing else. It does NOT prove publish rights,
      # 2FA bypass, or `@logikas` scope coverage — the header lists those, and
      # the publish remains the only step that reports on them.
      #
      # A smaller true claim beats a larger false one. The failure this whole
      # ticket exists for was an overclaim, and replacing it with a quieter
      # overclaim would repeat it.
      - name: Rehearse the credential
        run: |
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::NPM_BRAIN_TOKEN did not authenticate against the registry: ${who}"
            echo "  Nothing was uploaded. Check the token exists, has not expired, and targets"
            echo "  https://registry.npmjs.org. Note this probe cannot see publish rights, 2FA"
            echo "  bypass or scope coverage — a green result here is not a promise of a green publish."
            exit 1
          fi
          echo "authenticated as ${who}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BRAIN_TOKEN }}

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BRAIN_TOKEN }}
